# vim: ft=tmux
# Modern Tmux Statusline Configuration

# Color scheme
set -g mode-style "fg=#ffffff,bg=#1e1e2e"

set -g message-style "fg=#cdd6f4,bg=#1e1e2e"
set -g message-command-style "fg=#cdd6f4,bg=#1e1e2e"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Status bar
set -g status "on"
set -g status-interval 1
set -g status-justify "centre"
set -g status-style "fg=#a6adc8,bg=#1e1e2e"
set -g status-bg "#1e1e2e"

# Status bar padding
set -g status-left-length "50"
set -g status-right-length "50"

set -g status-left-style NONE
set -g status-right-style NONE

# Status left: Session name + User@Host + Current path (fixed width with padding)
# set -g status-left "#[fg=#313244,bg=#89b4fa,bold] #(whoami)@#h #[fg=#6c7086,bg=#1e1e2e] #(~/.config/tmux/scripts/format_path.sh '#{pane_current_path}') "
set -g status-left "#[fg=#313244,bg=#89b4fa,bold] #S #[fg=#6c7086,bg=#1e1e2e] #[fg=#cdd6f4,bg=#1e1e2e]#(whoami)@#h │ #(\~/.config/tmux/scripts/format_path.sh '#{pane_current_path}') "

# Status right: Time + Date
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#a6adc8,bg=#313244] %H:%M #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] %d-%b "

# Window status
setw -g window-status-activity-style "bold,fg=#fab387,bg=#313244"
setw -g window-status-separator "|"
setw -g window-status-style "NONE,fg=#6c7086,bg=#313244"

# Inactive window - button style
setw -g window-status-format "#[fg=#6c7086,bg=#313244,bold,noitalics,nounderscore] #I - #W "

# Active window - button style with highlight
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold,noitalics,nounderscore] #I - #W "
